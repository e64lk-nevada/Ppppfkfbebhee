services:
  - type: web
    name: btc-poly-paper-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PAPER_BALANCE
        value: "1000"
      - key: PAPER_STAKE
        value: "10"
      - key: MAX_PRICE_DIVERGENCE_PCT
        value: "0.15"
      - key: MIN_SECONDS_TO_END
        value: "35"
